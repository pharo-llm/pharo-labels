[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharo-task-miner"
version = "0.1.0"
description = "Empirical discovery of programming operations, language features and APIs in real Pharo repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "matplotlib>=3.9,<4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "anthropic>=1.12,<2",
    "huggingface_hub>=1.0",
]

[project.scripts]
pharo-miner = "pharo_task_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
