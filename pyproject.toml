[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharo-task-miner"
version = "0.1.0"
description = "Mine Pharo repositories and build a saturated, expert-validated taxonomy of the programming tasks of their methods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "matplotlib>=3.9,<4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "huggingface_hub>=1.0",
]

[project.optional-dependencies]
hf = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "accelerate>=1.0"]   # hf:<repo> models (e.g. the -PT adapters)

[project.scripts]
pharo-miner = "pharo_task_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
