# PharoTaskMiner configuration. Every key has a documented default in
# src/pharo_task_miner/config.py; this file only needs what you change.

project:                             # everything a run produces goes under results/
  data_dir: results/data
  output_dir: results
  validation_dir: results/validation
  database: results/data/processed/pharo_task_miner.sqlite

github:
  token_env: GITHUB_TOKEN
  cache_dir: results/data/raw/api_cache     # raw API responses, kept for auditing and resume
  cache_ttl_hours: null             # null = never expire (reproducible re-runs); use --refresh to re-fetch
  discovery:
    start_date: "2008-01-01"
    topics:
      - pharo
      - smalltalk
    languages:
      - Smalltalk
    organizations:
      - pharo-project
      - pharo-contributions
    indicator_repository_queries:
      - "pharo in:readme"
      - "BaselineOf in:readme"
      - "Metacello in:readme"
      - "tonel in:readme"
    indicator_code_queries:          # code search requires a token
      - "filename:.smalltalk.ston"
      - "BaselineOf extension:st"
    curated_lists: []                # e.g. [data/curated/experts.csv] with a full_name column

repositories:
  include_archived: true
  include_forks: false
  max_repositories: 0                # cap for strategy "all"; 0 = no cap
  clone_depth: 1
  clone_dir: results/data/repositories
  existing_clone_dirs: []            # other folders with owner__repo clones to reuse as-is
  accepted_pharo_status: [confirmed_pharo, probable_pharo]
  # Which repositories are worth analysing. Each criterion is separate (no combined score) and
  # every excluded repository is listed with the criterion it failed in
  # results/tables/repository_selection.csv; the counts are in results/reports/repository_selection.md.
  # Stars are deliberately not a threshold: half of the Pharo repositories have none.
  quality:
    require_pharo_source: true       # at least one Tonel/FileTree file: a README that mentions Pharo is not enough
    exclude_coursework: true         # homework, tutorials, katas, Advent of Code, classroom repositories
    min_commits: 10                  # some development history, not a one-off upload
    min_pharo_source_files: 10       # roughly 10 classes: not a toy
    require_tests: true              # has test classes
    require_external_interest: true  # at least 2 contributors, or 1 star, or 1 fork: not purely personal

sampling:
  # all = analyse every repository that passes repositories.quality (about 1,600): no sampling
  # to argue about. The other strategies draw sample_size repositories from them.
  # Changing anything here or in repositories.quality is picked up by ./1-mining.sh on its own:
  # it selects again and redoes cloning, parsing and the annotation sample (no GitHub search).
  strategy: all                      # all | random | stratified | diversity | manual
  sample_size: 50
  random_seed: 42
  max_per_owner: 5
  manual_selection_file: null        # CSV with a full_name column (strategy: manual)

corpus_filter:                       # ./1-2-filtering.sh: the study corpus used by steps 2, 3 and 4
  # Each criterion is a separate threshold with its source in docs/1-2-filtering.md; 0/false = off.
  # Every repository and the criteria it fails: results/tables/corpus_filter.csv.
  max_repositories: 150              # above this, repositories are chosen for diversity (never for stars)
  require_license: true              # benchmark tasks are redistributed with their provenance
  min_contributors: 2                # not a personal repository
  min_commits: 50                    # sustained development
  min_development_days: 180          # between creation and last push
  max_years_since_last_push: 5       # measured from the mining date: code for a current Pharo
  require_baseline: true             # a Metacello BaselineOf class: the project can be loaded
  require_tonel: true                # the source format of current Pharo
  min_non_test_methods: 200          # enough production code
  max_methods: 20000                 # image dumps and generated code
  min_test_methods: 20               # behaviour is specified by tests
  min_test_method_share: 0.10
  max_duplicated_method_share: 0.10  # methods copied from another repository
  max_parse_failure_share: 0.01
  max_per_owner: 5                   # used only when more than max_repositories pass
  random_seed: 42

parsing:
  backend: python                    # python | pharo (needs pharo_vm + pharo_image)
  pharo_vm: null
  pharo_image: null
  primary_format: tonel
  export_ast: true                   # ASTs go to data/parsed/*.jsonl.gz
  include_tests: true
  include_extension_methods: true

analysis:
  extract_message_sends: true
  extract_blocks: true
  extract_control_flow: true
  extract_api_usage: true

classification:
  domains:
    multi_label: true
    allow_unknown: true
    semantic_analysis: false
  operations:
    multi_label: true
    allow_unknown: true
    semantic_analysis: false         # LLM descriptions for a capped, stratified subset only

semantic:                            # optional local LLM; models are listed in models.yaml
  models_file: models.yaml
  use: null                          # null = the default in models.yaml; or a name / any Ollama tag
  max_methods: 200

validation:
  require_human_review: true         # taxonomy/statistics/reports wait for reviewed labels
  label_source: auto                 # reviewed labels to use: auto (human if imported, else LLM) | human | llm
  annotation_sample_size: 300
  overlap_fraction: 0.3
  annotators: [annotator_1, annotator_2]

llm_annotation:                      # ./2-ai-labelling.sh sets these from its SETTINGS block
  models: []                         # annotators: names from models.yaml (or Ollama tags)
  adjudicator: null                  # optional model that resolves disagreements
  consensus: majority                # majority | unanimous (when there is no adjudicator)
  evidence_policy: enforce           # enforce: drop labels without verbatim evidence | record
  spotcheck_size: 30                 # items exported for a blind human spot-check
  random_seed: 42

benchmark_generation:                # ./4-benchmark.sh; the method is explained in docs/4-benchmark.md
  pharo_version: "130"               # the image every task is validated in (get.pharo.org/64/<version>)
  mutalk_version: v3.0.8             # mutation testing framework loaded into that image
  tasks_per_operation: 3             # seed methods (candidate tasks) per operation
  min_tests: 4                       # test methods a task needs
  repeat: 3                          # times the tests must pass on the reference (once in reverse order)
  min_mutation_score: 0.8            # share of the mutants of the reference the tests must detect
  min_mutants: 4                     # fewer mutants = solution too small to assess its tests
  max_seed_similarity: 0.6           # above this the solution counts as a copy of its seed method
  max_repair_rounds: 3               # times a failing task is sent back with the image's error
  max_amplification_rounds: 2        # times tests are requested against surviving mutants
  require_operation: true            # the rule classifier must find the operation in the solution
  require_independent_solution: true # a second model must solve the task from its statement
  random_seed: 42

snapshot:                            # results saved on the Hugging Face Hub (./snapshot.sh, used by the step scripts)
  repo: pharo-llm/pharo-labels       # dataset id (huggingface.co/datasets/<repo>)
  revision: main                     # what 1-mining.sh downloads: main = latest, or a tag like snapshot-20261009-153000
  include_api_cache: true            # raw GitHub API responses (e-mails are redacted); enables offline re-runs
  include_clones: false              # cloned third-party repositories (re-downloadable from the recorded commits)

statistics:
  bootstrap_iterations: 1000
  random_seed: 42
  exclude_tests: false

benchmarks:
  inputs: []                         # e.g. [benchmarks/my_benchmark.json]

output:
  formats:
    - jsonl
    - csv
    - markdown
