# Pharo benchmark research pipeline — every setting of the 12 phases.
#
# PROFILE (top of run.sh, or PROFILE=full ./run.sh) picks the sample sizes under `profiles:`; everything
# else is shared. A phase is redone automatically when a setting it uses changes (its fingerprint in
# results/NN_*/_phase.json no longer matches); LLM answers already obtained are never asked again.

project:
  results_dir: results                     # one sub-folder per phase: results/01_literature ... results/12_evaluation
  data_dir: data                           # downloads and built tools (git-ignored; ./run.sh setup fills it)
  seed: 42

# ------------------------------------------------------------------ sample sizes (per profile)
profiles:
  pilot:                                   # the first deliverable (§8): small, runs on a laptop in a few hours
    literature_discovery_per_benchmark: 3  # literature tasks shown to each model in phase 4, per benchmark
    pharo_discovery: 48                    # Pharo methods shown to each model in phase 4 (random design)
    pharo_discovery_targeted: 12           # + targeted methods (rare behaviours), phase 4
    literature_annotation_per_benchmark: 4 # phase 6
    pharo_annotation: 60                   # phase 6, random design (frequency estimation)
    pharo_annotation_targeted: 12          # phase 6, targeted (discovery of rare behaviours, never weighted)
    expert_items: 40                       # phase 7: items in the expert workbook (stratified by AI agreement)
    pharo_profile: 150                     # phase 8: larger random sample, classified by the profile model(s)
    benchmark_candidates: 20               # phase 10
  full:
    literature_discovery_per_benchmark: 10
    pharo_discovery: 300
    pharo_discovery_targeted: 60
    literature_annotation_per_benchmark: 30
    pharo_annotation: 384                  # Cochran n for ±5% at 95%
    pharo_annotation_targeted: 60
    expert_items: 200
    pharo_profile: 3000
    benchmark_candidates: 100

# ------------------------------------------------------------------ phase 1: literature
literature:
  loader: pbr/benchmarks.py                # pinned sources of every benchmark + their download
  # Benchmark-level evaluation task type (the second, independent classification of §2). It is a property
  # of how a benchmark is built, so it is set here, once, with the reason, and not guessed by a model.
  task_types:
    humanevalplus:            {task_type: code_completion, granularity: function, evaluation: hidden unit tests (EvalPlus)}
    mbppplus:                 {task_type: code_generation, granularity: function, evaluation: hidden unit tests (EvalPlus)}
    bigcodebench_complete:    {task_type: code_completion, granularity: function, evaluation: unit tests}
    bigcodebench_instruct:    {task_type: code_generation, granularity: function, evaluation: unit tests}
    livecodebench_codegen:    {task_type: code_generation, granularity: program, evaluation: hidden input/output tests}
    livecodebench_testoutput: {task_type: test_generation, subtype: test_output_prediction, granularity: function, evaluation: exact match}
    livecodebench_execution:  {task_type: other, subtype: code_execution_prediction, granularity: function, evaluation: exact match}
    swebench_verified:        {task_type: bug_repair, subtype: issue_resolution, granularity: repository, evaluation: fail-to-pass / pass-to-pass tests}
    swebench_pro:             {task_type: bug_repair, subtype: issue_resolution, granularity: repository, evaluation: fail-to-pass / pass-to-pass tests}
    swebench_multilingual:    {task_type: bug_repair, subtype: issue_resolution, granularity: repository, evaluation: fail-to-pass / pass-to-pass tests}
    terminalbench2:           {task_type: other, subtype: agentic_terminal_task, granularity: environment, evaluation: test script on the final container state}
    nl2repo:                  {task_type: code_generation, subtype: repository_generation, granularity: repository, evaluation: the library's own test suite}
    deepswe:                  {task_type: bug_repair, subtype: issue_resolution, granularity: repository, evaluation: task tests}
  # SWE-bench Verified ⊂ SWE-bench; BigCodeBench-Instruct = Complete reworded; LCB test-output / execution reuse
  # LCB problems: kept in the tables, but the behaviour of a problem is counted once (dedup key).

# ------------------------------------------------------------------ setup (./run.sh does it before any phase)
setup:
  # Models that are not in the Ollama library: a LoRA adapter on Hugging Face, converted to GGUF with llama.cpp
  # and registered in Ollama on top of its base model (Modelfile ADAPTER). Built once; skipped when present.
  custom_models:
    - ollama_name: "pharo-llm/Qwen2.5-Coder-PT:7b"
      hf_repo: pharo-llm/Qwen2.5-Coder-7B-PT
      revision: checkpoint-15400        # the final checkpoint (epoch 5 of 5); "main" holds only the README
      base_hf: unsloth/Qwen2.5-Coder-7B # the base the adapter was trained on (its adapter_config.json)
      base_ollama: "qwen2.5-coder:7b-base-q8_0"   # the same weights in Ollama (8-bit: close to the training precision)
  llama_cpp:
    repo: https://github.com/ggml-org/llama.cpp
    ref: b6100                          # pinned release: only its Python converter is used (no build)
  tools_dir: data/tools                 # llama.cpp checkout, conversion venv, converted adapters

# ------------------------------------------------------------------ phase 2: Pharo corpus
corpus:
  snapshot_repo: pharo-llm/pharo-labels    # Hugging Face dataset written by ../labeling-pharo-repos (parsed methods)
  snapshot_revision: snapshot-20261010-182354
  local_parsed_dirs: []                    # folders of parsed *.jsonl.gz reused instead of downloading (optional)
  max_source_chars: 6000                   # longer methods are kept but flagged (generated code, image dumps)
  trivial_max_statements: 1                # accessors / one-statement methods are flagged `is_trivial`

# ------------------------------------------------------------------ phase 3: sampling
sampling:
  group_by: domain                         # repository groups (strata): domain | size | none
  min_group_repos: 8                       # smaller domains are pooled into "other"
  allocation: equal                        # methods per group: equal (every group equally visible) | proportional
  methods_per_repo: 2                      # stage 2: methods drawn per sampled repository and per split (caps large repos)
  exclude_mirrors: true                    # repositories that are mostly copies of another one
  include_tests: true                      # test methods are real Pharo code and matter for test generation
  exclude_duplicates: true                 # only canonical copies of duplicated methods
  exclude_parse_failures: true
  exclude_over_long: true
  # targeted sampling: rare behaviours we want to see at least once (never used for frequencies)
  targeted_signals:
    exceptions:      {selectors: ["on:do:", "ensure:", "ifCurtailed:", "signal:", "retry", "pass"]}
    concurrency:     {selectors: ["fork", "forkAt:", "critical:", "wait", "signal", "newProcess"]}
    streams:         {selectors: ["readStream", "writeStream", "nextPutAll:", "upToEnd", "contents"]}
    reflection:      {selectors: ["perform:", "perform:with:", "respondsTo:", "instVarNamed:", "compile:", "methodDict"]}
    ffi:             {selectors: ["ffiCall:", "ffiCall:module:"]}
    files:           {selectors: ["asFileReference", "readStreamDo:", "writeStreamDo:", "ensureCreateDirectory"]}
    network:         {globals: ["ZnClient", "ZnServer", "Socket", "ZnUrl"]}
    serialization:   {globals: ["STON", "NeoJSONReader", "NeoJSONWriter", "FLSerializer"]}
    ui:              {globals: ["SpPresenter", "SpApplication", "BlElement", "Morph"]}
    database:        {globals: ["SQLite3Connection", "VOMongoRepository", "GlorpSession"]}
    parsing:         {globals: ["PP2Node", "PPParser", "RBParser"]}

# ------------------------------------------------------------------ LLM annotation engine (phases 4, 5, 6, 8, 10, 12)
llm:
  # Three annotators of three families, never shown each other's answers (§4).
  annotators:
    - {name: qwen,    provider: ollama, model: "qwen3.8:27b",          family: Alibaba}
    - {name: gemma,   provider: ollama, model: "gemma4:31b",           family: Google}
    - {name: mistral, provider: ollama, model: "mistral-small3.2:24b", family: Mistral AI}
  editor: {name: qwen, provider: ollama, model: "qwen3.8:27b"}   # writes definitions of merged concepts (phase 5)
  embedder: {provider: ollama, model: "nomic-embed-text"}         # concept similarity (phase 5)
  temperature: 0
  num_ctx: 16384
  timeout_seconds: 600
  max_retries: 4                           # transport errors and invalid structured output
  requests_per_minute: 0                   # 0 = no limit (local); set for hosted APIs
  # Other providers: provider: openai (any OpenAI-compatible endpoint: base_url, api_key_env) or anthropic
  # (api_key_env: ANTHROPIC_API_KEY). Prices (USD / million tokens) give the cost of a run; local = 0.
  prices:
    ollama: {input: 0.0, output: 0.0}
  # what the same calls would cost on a hosted API, for the report (USD / million tokens)
  reference_price: {name: "Claude Haiku 5.5", input: 0.10, output: 0.50}

# ------------------------------------------------------------------ phase 4: discovery
discovery:
  batch_size: 6                            # items per prompt (each model sees the same batches)
  max_behaviors_per_item: 3

# ------------------------------------------------------------------ phase 5: shared taxonomy
taxonomy:
  # Embeddings only PROPOSE: concepts whose "name: definition" embeddings are this similar (cosine, average
  # linkage) form a candidate group; the editor model then decides which members mean the same thing
  # (embeddings alone rate "iterate" and "filter" closer than two wordings of "filter").
  candidate_threshold:
    category: 0.74
    subcategory: 0.76
    behavior: 0.78
  max_group_size: 9                        # larger candidate groups are re-split with a stricter threshold
  max_categories: 16                       # harmonisation: the editor merges categories down to this number
  min_models_for_behavior: 1               # a behaviour proposed by fewer models is kept but marked
  require_review: false                    # true = phase 5 stops until results/05_taxonomy/review/returned/ has a decision file
  version: v1

# ------------------------------------------------------------------ phase 6: annotation
annotation:
  max_behaviors_per_item: 3
  context: class                           # method only | class (superclass, instance variables, class comment)

# ------------------------------------------------------------------ phase 7: agreement + experts
validation:
  expert_strata: {full: 0.25, partial: 0.40, none: 0.35}   # share of expert items by AI agreement level
  blind: true                              # AI predictions hidden in the expert workbook (revealed only in adjudication)

# ------------------------------------------------------------------ phase 8: large-scale profile
profile:
  models: auto                             # auto = the annotator closest to the experts (else to the AI majority); or a list of names
  rare_share: 0.01                         # behaviours below this weighted share are "rare"

# ------------------------------------------------------------------ phase 9: coverage
coverage:
  min_support: 2                           # fewer observations = "investigate"
  confidence: 0.95

# ------------------------------------------------------------------ phase 10: benchmark construction
benchmark:
  author: {name: qwen, provider: ollama, model: "qwen3.8:27b"}
  selection: auto                          # auto = from the coverage matrix; or a CSV with behavior_id (results/10_benchmark/selected_behaviors.csv)
  statuses: [pharo_only, both]             # coverage statuses eligible for selection (auto)
  seeds_per_behavior: 2
  task_types: [code_generation, code_completion, bug_repair]
  pharo_version: "13"
  repair_rounds: 2                         # a candidate that fails execution is shown its errors and rewritten

# ------------------------------------------------------------------ phase 11: execution / validation
pharo:
  dir: data/pharo-image                    # VM + validation image (Pharo 13 + MuTalk + PharoBench-Support), built by setup
  version: "130"                           # get.pharo.org: Pharo 13 image and VM
  mutalk_version: v3.0.8
  reuse_from: ../pharo-benchmarks/work/pharo   # a ready image with the same versions is copied instead of rebuilt
  image: PharoBench.image
  job_timeout_seconds: 240
  workers: 3
  cpu_seconds_limit: 300                   # RLIMIT_CPU of every image process
  file_size_limit_mb: 200                  # RLIMIT_FSIZE
  sandbox: auto                            # auto = macOS sandbox-exec without network when it works; off
  repeat: 3                                # reference tests run 3 times (once reversed): flaky tests are rejected
  min_mutation_score: 0.6                  # MuTalk: share of mutants the tests kill
  min_tests: 3

# ------------------------------------------------------------------ phase 12: evaluation
evaluation:
  models:
    - {name: reference, provider: reference}               # the reference solutions: must score 100%
    - {name: qwen3.8-27b, provider: ollama, model: "qwen3.8:27b"}
    - {name: gemma4-31b, provider: ollama, model: "gemma4:31b"}
    # the Pharo PT model is a pre-trained (base) model, not a chat model: asked in plain completion mode
    - {name: pharo-pt-7b, provider: ollama, model: "pharo-llm/Qwen2.5-Coder-PT:7b", mode: completion}
  samples_per_task: 1                      # pass@1, greedy
  max_tokens: 1500
