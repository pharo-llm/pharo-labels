# PharoTaskMiner configuration (mining, the two filters, labelling). Every key has a documented default in
# src/pharo_task_miner/config.py; this file only needs what you change.

project:                             # everything a run produces goes under results/
  data_dir: results/data
  output_dir: results
  labelling_dir: results/labelling
  database: results/data/processed/pharo_task_miner.sqlite

github:
  token_env: GITHUB_TOKEN
  cache_dir: results/data/raw/api_cache     # raw API responses, kept for auditing and resume
  cache_ttl_hours: null             # null = never expire (reproducible re-runs); use --refresh to re-fetch
  discovery:
    start_date: "2008-01-01"
    topics:
      - pharo
      - smalltalk
    languages:
      - Smalltalk
    organizations:
      - pharo-project
      - pharo-contributions
    indicator_repository_queries:
      - "pharo in:readme"
      - "BaselineOf in:readme"
      - "Metacello in:readme"
      - "tonel in:readme"
    indicator_code_queries:          # code search requires a token
      - "filename:.smalltalk.ston"
      - "BaselineOf extension:st"
    curated_lists: []                # e.g. [data/curated/experts.csv] with a full_name column

repositories:
  include_archived: true
  include_forks: false
  max_repositories: 0                # cap for strategy "all"; 0 = no cap
  clone_depth: 1
  clone_dir: results/data/repositories
  existing_clone_dirs: []            # other folders with owner__repo clones to reuse as-is
  accepted_pharo_status: [confirmed_pharo, probable_pharo]
  # FILTER 1 — is this real Pharo code? Each criterion is separate (no combined score) and
  # every excluded repository is listed with the criterion it failed in
  # results/tables/repository_selection.csv; the counts are in results/REPORT.md (section 1).
  # Stars are deliberately not a threshold: half of the Pharo repositories have none.
  quality:
    require_pharo_source: true       # at least one Tonel/FileTree file: a README that mentions Pharo is not enough
    exclude_coursework: true         # homework, tutorials, katas, Advent of Code, classroom repositories
    min_commits: 10                  # some development history, not a one-off upload
    min_pharo_source_files: 10       # roughly 10 classes: not a toy
    require_tests: true              # has test classes
    require_external_interest: true  # at least 2 contributors, or 1 star, or 1 fork: not purely personal

sampling:
  # all = analyse every repository that passes repositories.quality (about 1,600): no sampling
  # to argue about. The other strategies draw sample_size repositories from them.
  # Changing anything here or in repositories.quality is picked up by ./run.sh on its own:
  # it selects again and redoes cloning and parsing (no GitHub search).
  strategy: all                      # all | random | stratified | diversity | manual
  sample_size: 50
  random_seed: 42
  max_per_owner: 5
  manual_selection_file: null        # CSV with a full_name column (strategy: manual)

corpus_filter:                       # FILTER 2 — the study corpus the labelling is based on (./run.sh filter)
  # Each criterion is a separate threshold (no combined score); 0/false = off.
  # Every repository and the criteria it fails: results/tables/corpus_filter.csv.
  max_repositories: 150              # above this, repositories are chosen for diversity (never for stars)
  require_license: true              # labelled methods are redistributed with their provenance
  min_contributors: 2                # not a personal repository
  min_commits: 50                    # sustained development
  min_development_days: 180          # between creation and last push
  max_years_since_last_push: 5       # measured from the mining date: code for a current Pharo
  require_baseline: true             # a Metacello BaselineOf class: the project can be loaded
  require_tonel: true                # the source format of current Pharo
  min_non_test_methods: 200          # enough production code
  max_methods: 20000                 # image dumps and generated code
  min_test_methods: 20               # behaviour is specified by tests
  min_test_method_share: 0.10
  max_duplicated_method_share: 0.10  # methods copied from another repository
  max_parse_failure_share: 0.01
  max_per_owner: 5                   # used only when more than max_repositories pass
  random_seed: 42

parsing:
  backend: python                    # python | pharo (needs pharo_vm + pharo_image)
  pharo_vm: null
  pharo_image: null
  primary_format: tonel
  export_ast: true                   # ASTs go to data/parsed/*.jsonl.gz
  include_tests: true
  include_extension_methods: true

analysis:
  extract_message_sends: true
  extract_blocks: true
  extract_control_flow: true
  extract_api_usage: true

labelling:                           # ./run.sh label — settings at the top of run.sh override these
  model: qwen3.8:27b                # inductive phase (open coding) and codebook definitions; Ollama tag
  confidence: 0.95                   # sample-size calculator (Cochran 1977, with finite population correction)
  margin_of_error: 0.05
  proportion: 0.5                    # 0.5 = most conservative
  sample_size: null                  # null = computed from the three values above
  batch_size: 50                     # methods drawn per saturation round
  patience: null                     # rounds in a row without a new category = saturation; null = derived from
                                     # min_share (12 rounds of 50: a 0.5% task would have shown with 95% probability)
  max_rounds: 40
  min_support: 2                     # methods a proposed category needs before it enters the taxonomy
  min_share: 0.005                   # ... and its share of the labelled methods: the taxonomy covers every task with >= 0.5% prevalence
  embedding_model: all-minilm        # merges task names with the same meaning (45 MB, Ollama); null = lexical merging only
  semantic_threshold: 0.78           # cosine similarity above which two names are one category
  include_tests: true
  # deductive phase (./run.sh classify): three model families classify a NEW sample with the codebook
  classify_models: [qwen3.8:27b, gemma4:12b, granite4.2:8b]   # Alibaba, Google, IBM
  classify_sample_size: null         # null = the sample-size calculator's n
  selfcheck_size: 100                # the first model again, codebook and examples shuffled: prompt sensitivity
  min_alpha: 0.667                   # Krippendorff's alpha below this: NOT_RELIABLE.md, no expert files
  gold_size: 200                     # methods the experts classify blind (stratified by the models' agreement)
  gold_min_per_stratum: 20
  random_seed: 42

api_cost:                            # REPORT.md section 6: what the labelling would cost on a commercial API
  prices_date: "2026-10-18"          # USD per million tokens, standard tier; update when the providers change them
  reference_model: GPT-6 Astra       # the model the savings are computed on
  batch_discount: 0.5                # Batch API: half price, answers within 24 h
  cache_min_prefix_tokens: 1024      # a shared prefix shorter than this is never cached
  chat_overhead_tokens: 20           # system/user message wrapping of a chat API, per call
  reasoning_tokens_per_call: 250     # hidden reasoning at low effort, billed as output (an assumption: measure it)
  budget_factor: [1.5, 2.0]          # pilot, retries, check model, a rerun
  models:                            # token_factor: tokens of this provider per GPT token (default 1)
    - {name: GPT-6 Astra, provider: OpenAI, input: 10.0, cached_input: 1.0, output: 50.0}
    - {name: GPT-6.1 Sol, provider: OpenAI, input: 2.0, cached_input: 0.10, output: 10.0}
    - {name: GPT-6 Luna, provider: OpenAI, input: 0.10, cached_input: 0.01, output: 0.50}
    - {name: GPT-5.4 mini, provider: OpenAI, input: 0.75, cached_input: 0.075, output: 4.50}
    - {name: Claude Fable 5.1, provider: Anthropic, input: 10.0, cached_input: 0.25, output: 50.0, token_factor: 1.25}
    - {name: Claude Opus 5.5, provider: Anthropic, input: 4.0, cached_input: 0.20, output: 20.0, token_factor: 1.25}
    - {name: Claude Sonnet 5.5, provider: Anthropic, input: 2.0, cached_input: 0.10, output: 10.0, token_factor: 1.25}
    - {name: Claude Haiku 5.5, provider: Anthropic, input: 0.10, cached_input: 0.01, output: 0.50, token_factor: 1.25}
    - {name: Gemini 4 Argon, provider: Google, input: 2.0, cached_input: 0.10, output: 10.0}
    - {name: Gemini 3.8 Flash, provider: Google, input: 0.75, cached_input: 0.075, output: 3.75}
    - {name: Gemini 2.5 Flash-Lite, provider: Google, input: 0.10, cached_input: 0.01, output: 0.40}

snapshot:                            # results saved on the Hugging Face Hub (./run.sh pull / push)
  repo: pharo-llm/pharo-labels       # dataset id (huggingface.co/datasets/<repo>)
  revision: main                     # what ./run.sh downloads: main = latest, or a tag like snapshot-20261009-153000
  include_api_cache: true            # raw GitHub API responses (e-mails are redacted); enables offline re-runs
  include_clones: false              # cloned third-party repositories (re-downloadable from the recorded commits)
