# Local open-weight models for the optional semantic step (LLM descriptions of
# methods and repository domains). Nothing is sent to a cloud service.
#
#   .venv/bin/pharo-miner models                         list these + whether installed
#   ./run.sh --semantic --model qwen3-8b                 use one for a run
#   .venv/bin/pharo-miner discover-operations --semantic --model qwen2.5-coder-14b
#
# Add your own entry, or pass any Ollama tag directly (--model mistral:7b).
# Providers: "ollama" (default URL http://localhost:11434) or "openai_compatible"
# (llama.cpp llama-server, LM Studio, vLLM; set base_url).
# Optional per-model keys: base_url, num_ctx, max_tokens, timeout_seconds, think (Ollama thinking models).

default: qwen2.5-coder-7b

models:
  # --- general code models (recommended) -------------------------------------
  qwen2.5-coder-7b:
    provider: ollama
    model: qwen2.5-coder:7b
    size: 4.7 GB
    notes: Default. Code-specialised, follows JSON schemas reliably, Apache-2.0.
  qwen2.5-coder-3b:
    provider: ollama
    model: qwen2.5-coder:3b
    size: 1.9 GB
    notes: Faster on small laptops; noticeably less accurate.
  qwen2.5-coder-14b:
    provider: ollama
    model: qwen2.5-coder:14b
    size: 9.0 GB
    notes: Better descriptions; needs ~16 GB RAM.
  qwen3-8b:
    provider: ollama
    model: qwen3:8b
    size: 5.2 GB
    think: false
    notes: Strong general reasoning; thinking disabled for speed.
  deepseek-coder-v2-16b:
    provider: ollama
    model: deepseek-coder-v2:16b
    size: 8.9 GB
    notes: Mixture-of-experts code model (fast for its size).
  llama3.1-8b:
    provider: ollama
    model: llama3.1:8b
    size: 4.9 GB
    notes: General-purpose baseline.
  gemma3-12b:
    provider: ollama
    model: gemma3:12b
    size: 8.1 GB
    notes: General-purpose; good instruction following.

  # --- Pharo fine-tuned models (pharo-llm on Ollama) ----------------------------
  pharo-one-7b:
    provider: ollama
    model: pharo-llm/pharo-one-7B-v1.0.0
    size: 4.7 GB
    notes: Fine-tuned on Pharo code generation; check JSON reliability on a small sample first.
  pharo-qwen-sft-7b:
    provider: ollama
    model: pharo-llm/Qwen2.5-Coder-SFT:q4_K_M
    size: 4.7 GB
    notes: Qwen2.5-Coder fine-tuned on Pharo.

  # --- other local servers -------------------------------------------------------
  llama-server:
    provider: openai_compatible
    base_url: http://localhost:8080
    model: local
    notes: "llama.cpp: llama-server -m model.gguf --port 8080"
  lm-studio:
    provider: openai_compatible
    base_url: http://localhost:1234
    model: qwen2.5-coder-7b-instruct
    notes: LM Studio local server; set model to the identifier LM Studio shows.

  # --- big models on YOUR OWN server (GPU machine, university cluster, cloud VM) ---------
  # Replace SERVER-ADDRESS with the server's IP or hostname. If the port is not reachable
  # from your laptop, open an SSH tunnel first and use localhost instead:
  #   ssh -N -L 11434:localhost:11434 you@SERVER-ADDRESS     (Ollama)
  #   ssh -N -L 8000:localhost:8000 you@SERVER-ADDRESS       (vLLM)
  server-ollama-qwen-coder-32b:          # on the server: ollama pull qwen2.5-coder:32b
    provider: ollama
    base_url: http://SERVER-ADDRESS:11434
    model: qwen2.5-coder:32b
    size: 20 GB
    notes: Ollama on a remote machine (start it there with OLLAMA_HOST=0.0.0.0 ollama serve).
  server-ollama-llama-3.3-70b:           # on the server: ollama pull llama3.3:70b
    provider: ollama
    base_url: http://SERVER-ADDRESS:11434
    model: llama3.3:70b
    size: 43 GB
    notes: Needs ~48 GB of GPU memory.
  server-vllm:                           # on the server: vllm serve Qwen/Qwen2.5-Coder-32B-Instruct --port 8000
    provider: openai_compatible
    base_url: http://SERVER-ADDRESS:8000
    model: Qwen/Qwen2.5-Coder-32B-Instruct   # must equal the name given to `vllm serve`
    concurrency: 8                           # vLLM handles many requests at once
    notes: vLLM (fastest for big open-weight models). Any Hugging Face model works.

  # --- hosted APIs (used by the LLM annotation step, ./2-ai-labelling.sh) ------------------
  # The API key is read from the environment variable in `api_key_env`; 2-ai-labelling.sh asks
  # for it once and stores it in .env (git-ignored). Prices and model ids change: check the
  # provider's page before a large run. Extra keys: effort (Claude), max_tokens, concurrency,
  # temperature (null = do not send), max_tokens_param, extra_body (OpenAI-compatible).
  claude-opus-5-5:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    effort: high
    fallbacks: default        # on a safety decline the API retries on another model; the served model is recorded
    notes: Most capable Opus. ~$4/$20 per M tokens; 300 items ≈ a few dollars (system prompt is cached).
  claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    effort: high
    fallbacks: default
    notes: Faster and cheaper than Opus; strong at code.
  claude-haiku-5-5:
    provider: anthropic
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    effort: medium
    notes: Very cheap; use as an extra panel member, not alone.

  # OpenAI (or any OpenAI-compatible API). Put the exact model id from the provider's model list.
  openai:
    provider: openai_compatible
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
    model: CHANGE-ME              # e.g. the current GPT model id shown on platform.openai.com
    max_tokens_param: max_completion_tokens
    temperature: null             # reasoning models reject temperature; set 0 for models that accept it
    max_tokens: 16000
    notes: Set `model` before use.

  # OpenRouter: one key for many open-weight models (Qwen, Llama, DeepSeek, Mistral...).
  openrouter-qwen-coder-32b:
    provider: openai_compatible
    base_url: https://openrouter.ai/api
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen-2.5-coder-32b-instruct
    notes: Open-weight model served by OpenRouter; check the id on openrouter.ai/models.
  openrouter-llama-3.3-70b:
    provider: openai_compatible
    base_url: https://openrouter.ai/api
    api_key_env: OPENROUTER_API_KEY
    model: meta-llama/llama-3.3-70b-instruct
    notes: Open-weight model served by OpenRouter; check the id on openrouter.ai/models.
